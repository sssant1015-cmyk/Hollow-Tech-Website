<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 100 100"
>
    <defs>
        <linearGradient
            id="hollow-gradient"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >
            <stop offset="0%" stop-color="#24003d"/>
            <stop offset="100%" stop-color="#9333ea"/>
        </linearGradient>

        <filter id="purple-glow">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <rect
        width="100"
        height="100"
        rx="24"
        fill="#08050c"
    />

    <rect
        x="7"
        y="7"
        width="86"
        height="86"
        rx="20"
        fill="url(#hollow-gradient)"
        stroke="#c084fc"
        stroke-width="2"
    />

    <path
        d="M30 24V76M70 24V76M30 49H70"
        fill="none"
        stroke="#ffffff"
        stroke-width="11"
        stroke-linecap="round"
        filter="url(#purple-glow)"
    />
</svg>
